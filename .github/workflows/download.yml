name: Lecture Downloader

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'StudyRatna / Lecture URL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install playwright yt-dlp requests
        playwright install --with-deps chromium

    - name: Run Downloader Script
      env:
        TARGET_URL: ${{ inputs.target_url }}
      run: python downloader.py

    - name: Upload Video Artifact
      uses: actions/upload-artifact@v4
      with:
        name: downloaded-lecture
        path: downloaded_lecture.mp4
        
